<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#09090B" />
  <meta name="description" content="Darkness — Sistema minimalista de crecimiento personal: hábitos, cuerpo, lectura, diario y finanzas." />

  <!-- Preparación PWA / iOS / Android -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Darkness" />
  <link rel="manifest" href="manifest.json?v=1.3.0" />
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg?v=1.3.0" />
  <link rel="apple-touch-icon" href="assets/icons/icon.svg?v=1.3.0" />

  <title>Darkness — Personal Growth OS</title>

  <!-- Tipografías Minimalistas y Elegantes: Plus Jakarta Sans & IBM Plex Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <!-- Hojas de Estilo con Cache-Busting v1.2.0 -->
  <link rel="stylesheet" href="assets/css/variables.css?v=1.3.0" />
  <link rel="stylesheet" href="assets/css/base.css?v=1.3.0" />
  <link rel="stylesheet" href="assets/css/layout.css?v=1.3.0" />
  <link rel="stylesheet" href="assets/css/components.css?v=1.3.0" />
  <link rel="stylesheet" href="assets/css/journal.css?v=1.3.0" />
</head>
<body>
  <div class="app-shell" id="app-shell">
    <!-- Sidebar Lateral Izquierda (Escritorio) -->
    <aside class="sidebar" aria-label="Navegación Principal">
      <div class="sidebar-header">
        <a href="#/dashboard" class="brand">
          <span class="brand-mark">D</span>
          <span class="brand-text">Darkness</span>
        </a>
        <button type="button" class="btn-icon" id="btn-collapse-sidebar" title="Colapsar barra lateral" aria-label="Colapsar barra lateral">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/>
          </svg>
        </button>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav"></nav>

      <div class="sidebar-footer">
        <div class="sidebar-actions">
          <button type="button" class="btn-icon" data-action="toggle-theme" aria-label="Cambiar Tema"></button>
          <a href="#/settings" class="btn btn-ghost btn-sm sync-badge-text" style="flex:1;justify-content:flex-start;">
            Configurar Nube
          </a>
        </div>

        <a href="#/settings" class="user-pill">
          <div class="user-avatar" id="sidebar-user-avatar">UD</div>
          <div class="user-meta">
            <div class="user-name" id="sidebar-user-name">Usuario Darkness</div>
            <div class="user-status">
              <span class="status-dot"></span>
              <span id="sidebar-sync-status">Almacenamiento Local</span>
            </div>
          </div>
        </a>
      </div>
    </aside>

    <!-- Contenedor Principal -->
    <div class="main-wrapper">
      <!-- Barra Superior Móvil (Visible en Teléfonos) -->
      <header class="mobile-topbar">
        <a href="#/dashboard" class="brand">
          <span class="brand-mark">D</span>
          <span class="brand-text">Darkness</span>
        </a>
        <div class="mobile-topbar-actions">
          <button type="button" class="btn-icon" id="btn-mobile-memento" data-action="toggle-memento" title="Memento Mori" aria-label="Abrir Memento Mori"></button>
          <button type="button" class="btn-icon" data-action="toggle-theme" aria-label="Cambiar Tema"></button>
        </div>
      </header>

      <!-- Vista Dinámica del Enrutador -->
      <main class="main-content" id="app-view" role="main"></main>
    </div>

    <!-- Backdrop y Columna Lateral Derecha: MEMENTO MORI (Fija en PC Dashboard / Deslizante lateral en Móvil) -->
    <div class="memento-backdrop" id="memento-backdrop"></div>
    <aside class="memento-sidebar" id="memento-sidebar" aria-label="Memento Mori Life Calendar"></aside>

    <!-- Barra de Navegación Inferior Móvil (iOS / Android) -->
    <nav class="mobile-bottom-nav" id="mobile-bottom-nav" aria-label="Navegación Móvil"></nav>
  </div>

  <!-- Aplicación Modular con Cache-Busting v1.2.0 -->
  <script type="module" src="js/app.js?v=1.3.0"></script>
</body>
</html>
